spring.application.name=skr-garment-erp

# DevTools: avoid RestartClassLoader missing DTO classes (ClassNotFoundException: LibraryCirculationRequest)
# when IDE output does not match target/classes. Full JVM restart still applies code changes.
spring.devtools.restart.enabled=false
# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# DATABASE CONFIG
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/skr_garment_erp
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA CONFIG
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true


# ===============================
# FILE UPLOAD
# ===============================
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB



# Base URL for activation links (e.g. https://yourapp.com or http://localhost:3000)
app.base-url=http://localhost:8080

# ===============================
# OpenAPI / Swagger UI
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.persistAuthorization=true
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=false